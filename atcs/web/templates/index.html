<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATCS - Adaptive Traffic Signal Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Adaptive Traffic Signal Control</h1>
            <div class="status-indicator">
                <span id="connection-status" class="status-disconnected">Disconnected</span>
            </div>
        </header>

        <div class="toolbar">
            <button id="add-device-btn">+ Add Device</button>
            <button id="refresh-btn">Refresh</button>
        </div>

        <div id="devices-container" class="devices-grid">
            <!-- Devices will be rendered here -->
        </div>

        <div id="events-panel" class="events-panel">
            <h3>Live Events</h3>
            <div id="events-list"></div>
        </div>
    </div>

    <!-- Add Device Modal -->
    <div id="add-device-modal" class="modal">
        <div class="modal-content">
            <h2>Create New Traffic Light</h2>
            <form id="add-device-form">
                <label>Device ID (optional):</label>
                <input type="text" name="id" placeholder="auto-generated">

                <label>Green Timer (sec):</label>
                <input type="number" name="greenTimer" value="50" min="1">

                <label>Orange Timer (sec):</label>
                <input type="number" name="orangeTimer" value="5" min="1">

                <label>Red Timer (sec):</label>
                <input type="number" name="redTimer" value="240" min="1">

                <div class="modal-buttons">
                    <button type="submit">Create</button>
                    <button type="button" id="cancel-add">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.7.1/dist/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
